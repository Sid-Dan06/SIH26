<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Adaptive Training - Test Page</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, Segoe UI, Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
            background: #fafafa;
        }

        h1 {
            font-size: 22px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .question {
            border: 1px solid #e2e2e2;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 14px;
            background: white;
        }

        .question p {
            font-weight: 600;
            margin: 0 0 4px 0;
        }

        .tag {
            color: #999;
            font-size: 12px;
            display: block;
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin: 6px 0;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        label:hover {
            background: #f2f2f2;
        }

        #submitBtn {
            padding: 12px 24px;
            font-size: 15px;
            cursor: pointer;
            margin: 20px 0 40px 0;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
        }

        #submitBtn:hover {
            background: #1d4ed8;
        }

        /* --- Results dashboard --- */
        #result {
            display: none;
        }

        .rec-card {
            background: linear-gradient(135deg, #eff6ff, #eef2ff);
            border: 1px solid #c7d2fe;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 30px;
        }

        .rec-card .label {
            font-size: 12px;
            text-transform: uppercase;
            color: #6366f1;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .rec-card h2 {
            margin: 4px 0 14px 0;
            font-size: 24px;
        }

        .rec-meta {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .rec-meta div {
            font-size: 14px;
        }

        .rec-meta b {
            display: block;
            font-size: 16px;
        }

        .rec-reason {
            font-size: 14px;
            color: #444;
            background: white;
            padding: 10px 14px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .skill-block {
            margin-bottom: 18px;
        }

        .skill-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .skill-bar-bg {
            background: #e5e7eb;
            border-radius: 6px;
            height: 10px;
            overflow: hidden;
        }

        .skill-bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.4s ease;
        }

        .topics {
            margin-top: 10px;
            display: none;
        }

        .topics.open {
            display: block;
        }

        .topic-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .topic-bar-bg {
            flex: 1;
            background: #eee;
            border-radius: 5px;
            height: 6px;
            margin: 0 10px;
            overflow: hidden;
        }

        .topic-bar-fill {
            height: 100%;
            border-radius: 5px;
        }

        .topic-name {
            width: 170px;
            color: #444;
        }

        .topic-pct {
            width: 45px;
            text-align: right;
            color: #666;
        }

        /* --- Simulator --- */
        .sim-panel {
            background: #fff;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .sim-title {
            font-size: 15px;
            font-weight: 700;
            color: #334155;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .sim-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .sim-controls label {
            display: inline-block;
            margin: 0;
            padding: 0;
            font-size: 13px;
            background: none;
        }
        .sim-controls label:hover {
            background: none;
        }
        .sim-btn {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
        }
        .sim-btn:hover {
            background: #059669;
        }

        /* --- Answer Review --- */
        .review-title {
            margin-top: 40px;
            margin-bottom: 15px;
            font-size: 18px;
            color: #1e293b;
        }
        .review-item {
            background: #fff;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            padding: 15px;
            margin-bottom: 12px;
            text-align: left;
        }
        .review-item.correct {
            border-left: 4px solid #10b981;
        }
        .review-item.incorrect {
            border-left: 4px solid #ef4444;
        }
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
            color: #64748b;
        }
        .review-status {
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
        }
        .review-status.correct {
            background: #d1fae5;
            color: #065f46;
        }
        .review-status.incorrect {
            background: #fee2e2;
            color: #991b1b;
        }
        .review-question {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .review-answers {
            font-size: 13px;
            margin-bottom: 4px;
        }
        .review-time {
            font-size: 11px;
            color: #94a3b8;
            text-align: right;
        }

        .auth-panel {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .auth-panel input {
            padding: 9px;
            margin: 4px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        .auth-panel button {
            padding: 9px 14px;
            margin: 4px;
            border: 0;
            border-radius: 6px;
            color: white;
            background: #2563eb;
            cursor: pointer;
        }

        #authStatus {
            color: #475569;
            font-size: 13px;
            margin: 8px 4px 0;
        }
    </style>
</head>

<body>

    <h1>Pre-Assessment (Test Page)</h1>
    <p class="subtitle">Throwaway test UI — not the final app. Built to try the real backend end-to-end.</p>

    <div class="auth-panel">
        <strong>Account</strong><br>
        <input id="username" placeholder="Username">
        <input id="email" type="email" placeholder="Email (for registration)">
        <input id="password" type="password" placeholder="Password (8+ characters)">
        <button id="registerBtn" type="button">Register</button>
        <button id="loginBtn" type="button">Login</button>
        <div id="authStatus">Register or log in before submitting the assessment.</div>
    </div>

    <div id="questions">Loading questions...</div>
    <button id="submitBtn" style="display:none;">Submit Assessment</button>

    <div id="result"></div>

    <script>
        const API_BASE = "http://127.0.0.1:8000";
        let questions = [];
        let questionTimes = {};     // question_id -> seconds taken
        let lastActionTime = null;  // timestamp of the last answer click (or page load)
        let currentData = null;     // stores the active response payload for updates
        let authToken = localStorage.getItem("adaptive_training_token");
        let currentUser = JSON.parse(localStorage.getItem("adaptive_training_user") || "null");

        function authHeaders() {
            return {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${authToken}`
            };
        }

        function updateAuthStatus(message) {
            document.getElementById("authStatus").innerText = message;
        }

        async function authenticate(mode) {
            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const endpoint = mode === "register" ? "/auth/register" : "/auth/login";
            const payload = mode === "register"
                ? { username, email, password }
                : { login: username || email, password };

            try {
                const res = await fetch(`${API_BASE}${endpoint}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) {
                    updateAuthStatus("Error: " + (data.detail || "Authentication failed."));
                    return;
                }
                authToken = data.token;
                currentUser = data.user;
                localStorage.setItem("adaptive_training_token", authToken);
                localStorage.setItem("adaptive_training_user", JSON.stringify(currentUser));
                document.getElementById("username").value = currentUser.username;
                document.getElementById("email").value = currentUser.email;
                updateAuthStatus(`Logged in as ${currentUser.username}. You can submit the assessment.`);
            } catch (error) {
                updateAuthStatus("Network error: " + error.message);
            }
        }

        async function loadQuestions() {
            const res = await fetch(`${API_BASE}/assessment/start`);
            questions = await res.json();

            lastActionTime = Date.now();

            const container = document.getElementById("questions");
            container.innerHTML = "";

            questions.forEach(q => {
                const div = document.createElement("div");
                div.className = "question";
                div.innerHTML = `
            <p>${q.question}</p>
            <span class="tag">${q.skill} / ${q.topic} / ${q.difficulty}</span>
            ${q.options.map(opt => `
                <label>
                    <input type="radio" name="${q.question_id}" value="${opt}" data-qid="${q.question_id}">
                    ${opt}
                </label>
            `).join("")}
        `;
                container.appendChild(div);
            });

            // Track answer timing: time between consecutive answer clicks,
            // so response_time_score reflects actual thinking time per question
            // rather than total time since page load.
            document.querySelectorAll('input[type="radio"]').forEach(input => {
                input.addEventListener("change", (e) => {
                    const qid = e.target.dataset.qid;
                    if (questionTimes[qid] === undefined) {
                        const now = Date.now();
                        questionTimes[qid] = (now - lastActionTime) / 1000;
                        lastActionTime = now;
                    }
                });
            });

            document.getElementById("submitBtn").style.display = "block";
        }

        async function submitAssessment() {
            const responses = questions.map(q => {
                const selected = document.querySelector(`input[name="${q.question_id}"]:checked`);
                return {
                    question_id: q.question_id,
                    selected_answer: selected ? selected.value : "",
                    time_taken_seconds: questionTimes[q.question_id] ?? 30 // fallback if somehow untimed
                };
            });

            const unanswered = responses.filter(r => r.selected_answer === "").length;
            if (unanswered > 0) {
                alert(`You have ${unanswered} unanswered question(s). Please answer all questions.`);
                return;
            }

            const btn = document.getElementById("submitBtn");
            const originalText = btn.innerText;
            btn.innerText = "Analyzing & Generating Study Material (Please wait 5-10s)...";
            btn.disabled = true;
            btn.style.opacity = "0.7";
            btn.style.cursor = "not-allowed";

            const payload = { user_id: "test_user_manual", responses: responses };

            if (!authToken || !currentUser) {
                alert("Please register or log in before submitting the assessment.");
                btn.innerText = originalText;
                btn.disabled = false;
                btn.style.opacity = "1";
                btn.style.cursor = "pointer";
                return;
            }
            payload.user_id = String(currentUser.id);

            try {
                const res = await fetch(`${API_BASE}/assessment/submit`, {
                    method: "POST",
                    headers: authHeaders(),
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const err = await res.json();
                    alert("Error: " + JSON.stringify(err));
                    return;
                }

                const data = await res.json();
                displayResult(data);
            } catch (error) {
                alert("Network error: " + error.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
                btn.style.opacity = "1";
                btn.style.cursor = "pointer";
            }
        }

        function masteryColor(pct) {
            if (pct < 40) return "#ef4444";       // red
            if (pct < 70) return "#f59e0b";       // amber
            if (pct < 85) return "#3b82f6";       // blue
            return "#22c55e";                     // green
        }

        function skillAverage(topics) {
            const values = Object.values(topics).map(t => t.mastery);
            return values.reduce((a, b) => a + b, 0) / values.length;
        }

        function displayResult(data) {
            document.getElementById("questions").style.display = "none";
            document.getElementById("submitBtn").style.display = "none";

            // Save the data to currentData so the simulator can read it
            currentData = data;

            const rec = data.recommendation;
            const resultDiv = document.getElementById("result");
            resultDiv.style.display = "block";

            let html = "";

            if (rec) {
                html += `
                    <div class="rec-card">
                        <span class="label">Recommended Next</span>
                        <h2>${rec.skill} — ${rec.topic}</h2>
                        <div class="rec-meta">
                            <div><b>${rec.mastery}%</b>Current Mastery</div>
                            <div><b>${rec.difficulty}</b>Difficulty</div>
                            <div><b>${rec.content_type}</b>Content Type</div>
                        </div>
                        <div class="rec-reason"><b>Why:</b> ${rec.reason}</div>
                        
                        ${data.learning_content ? `
                            <hr style="border: 0; border-top: 1px solid #c7d2fe; margin: 20px 0;">
                            <h3 style="margin-top: 20px; color: #1e3a8a;">Personalized Study Material</h3>
                            <div class="learning-material" style="background: white; padding: 20px; border-radius: 8px; border: 1px solid #e2e2e2; white-space: pre-wrap; font-family: inherit; line-height: 1.6; text-align: left;">
                                ${data.learning_content}
                            </div>
                        ` : ''}
                    </div>

                    <!-- Simulator Panel -->
                    <div class="sim-panel">
                        <h3 class="sim-title">🔄 Adaptive Learning Loop Simulator</h3>
                        <p style="font-size:12px; margin-top:0; color:#475569;">
                            Simulate studying the recommended topic (<b>${rec.skill} — ${rec.topic}</b>) to see your mastery score update and the next topic adapt!
                        </p>
                        <div class="sim-controls">
                            <label>
                                Quiz Score: 
                                <select id="simQuizCorrect" style="padding: 4px 8px; border-radius: 4px; border: 1px solid #cbd5e1;">
                                    <option value="5">5/5 (100%)</option>
                                    <option value="4" selected>4/5 (80%)</option>
                                    <option value="3">3/5 (60%)</option>
                                    <option value="2">2/5 (40%)</option>
                                    <option value="1">1/5 (20%)</option>
                                </select>
                            </label>
                            
                            <label style="margin-left: 10px;">
                                Practical Exercise:
                                <select id="simExerciseScore" style="padding: 4px 8px; border-radius: 4px; border: 1px solid #cbd5e1;">
                                    <option value="100">100% (Perfect)</option>
                                    <option value="80" selected>80% (Great)</option>
                                    <option value="50">50% (Passing)</option>
                                    <option value="20">20% (Struggling)</option>
                                    <option value="none">None (No Exercise)</option>
                                </select>
                            </label>

                            <button class="sim-btn" onclick="simulateLearning()" style="margin-left: 10px;">Simulate Lesson Completed</button>
                        </div>
                        <div id="simFeedback" style="margin-top: 10px; font-size: 13px; font-weight: 600; color: #0f766e; display: none;"></div>
                    </div>
                `;
            } else {
                html += `
                    <div class="rec-card" style="background: #ecfdf5; border-color: #a7f3d0;">
                        <h2>🎉 All Goals Completed!</h2>
                        <p>Your skill levels across all topics are outstanding. Ready for development work!</p>
                    </div>
                `;
            }

            html += `<h3>Skill Dashboard</h3>`;

            for (const [skill, topics] of Object.entries(data.skill_profile)) {
                const avg = skillAverage(topics);
                const color = masteryColor(avg);

                html += `
                    <div class="skill-block">
                        <div class="skill-header" onclick="document.getElementById('topics-${skill}').classList.toggle('open')">
                            <span>${skill}</span>
                            <span>${avg.toFixed(1)}%</span>
                        </div>
                        <div class="skill-bar-bg">
                            <div class="skill-bar-fill" style="width:${avg}%; background:${color};"></div>
                        </div>
                        <div class="topics" id="topics-${skill}">
                `;

                for (const [topic, t] of Object.entries(topics)) {
                    const tColor = masteryColor(t.mastery);
                    html += `
                        <div class="topic-row">
                            <span class="topic-name">${topic}</span>
                            <div class="topic-bar-bg">
                                <div class="topic-bar-fill" style="width:${t.mastery}%; background:${tColor};"></div>
                            </div>
                            <span class="topic-pct">${t.mastery}%</span>
                        </div>
                    `;
                }

                html += `</div></div>`;
            }

            // Append Answer Review Section if present
            if (data.answer_review) {
                html += `
                    <h3 class="review-title">📝 Pre-Assessment Answer Review</h3>
                    <div class="review-list">
                        ${data.answer_review.map((item, idx) => `
                            <div class="review-item ${item.is_correct ? 'correct' : 'incorrect'}">
                                <div class="review-header">
                                    <span>Question ${idx + 1} (${item.skill} — ${item.topic})</span>
                                    <span class="review-status ${item.is_correct ? 'correct' : 'incorrect'}">
                                        ${item.is_correct ? 'Correct' : 'Incorrect'}
                                    </span>
                                </div>
                                <div class="review-question">${item.question}</div>
                                <div class="review-answers">
                                    <div>Your Answer: <span style="font-weight: 600; color: ${item.is_correct ? '#16a34a' : '#dc2626'};">${item.selected_answer || '(No Answer)'}</span></div>
                                    ${!item.is_correct ? `<div>Correct Answer: <span style="font-weight: 600; color: #16a34a;">${item.correct_answer}</span></div>` : ''}
                                </div>
                                <div class="review-time">⏱️ Time taken: ${item.time_taken_seconds}s</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            resultDiv.innerHTML = html;
        }

        async function simulateLearning() {
            if (!currentData || !currentData.recommendation) return;

            const rec = currentData.recommendation;
            const quizCorrect = parseInt(document.getElementById("simQuizCorrect").value);
            const exerciseVal = document.getElementById("simExerciseScore").value;
            const exerciseScore = exerciseVal === "none" ? null : parseFloat(exerciseVal);

            const feedbackDiv = document.getElementById("simFeedback");
            feedbackDiv.style.display = "block";
            feedbackDiv.innerHTML = "⌛ Recalculating adaptive path & generating next lesson...";

            const payload = {
                user_id: currentData.user_id || "test_user_manual",
                skill: rec.skill,
                topic: rec.topic,
                quiz_correct: quizCorrect,
                quiz_total: 5,
                exercise_score: exerciseScore,
                skill_profile: currentData.skill_profile,
                time_taken_seconds: null
            };

            try {
                const res = await fetch(`${API_BASE}/learning/complete`, {
                    method: "POST",
                    headers: authHeaders(),
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const err = await res.json();
                    alert("Error updating mastery: " + JSON.stringify(err));
                    feedbackDiv.style.display = "none";
                    return;
                }

                const result = await res.json();

                // Compute dynamic message
                const update = result.mastery_update;
                let feedbackHtml = `✅ Mastery Updated! <b>${rec.topic}</b> went from <b>${update.old_mastery}%</b> to <b>${update.new_mastery}%</b>!<br>`;

                // Update dataset
                currentData.skill_profile = result.updated_skill_profile;
                currentData.recommendation = result.new_recommendation;
                currentData.learning_content = null;

                // Load next content if recommendation exists
                if (result.new_recommendation) {
                    const contentRes = await fetch(`${API_BASE}/generate-content`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(result.new_recommendation)
                    });
                    if (contentRes.ok) {
                        const contentData = await contentRes.json();
                        currentData.learning_content = contentData.content;
                    }
                }

                displayResult(currentData);

                // Show completion feedback back in the newly generated panel
                const newFeedback = document.getElementById("simFeedback");
                if (newFeedback) {
                    newFeedback.style.display = "block";
                    newFeedback.innerHTML = feedbackHtml;
                }

            } catch (error) {
                alert("Network error: " + error.message);
                feedbackDiv.style.display = "none";
            }
        }

        document.getElementById("submitBtn").addEventListener("click", submitAssessment);
        document.getElementById("registerBtn").addEventListener("click", () => authenticate("register"));
        document.getElementById("loginBtn").addEventListener("click", () => authenticate("login"));
        if (authToken && currentUser) {
            document.getElementById("username").value = currentUser.username;
            document.getElementById("email").value = currentUser.email;
            updateAuthStatus(`Logged in as ${currentUser.username}.`);
        }
        loadQuestions();
    </script>

</body>

</html>
